name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ">=0.13.4,<0.14"

      - name: Install documentation dependencies
        run: uv sync --locked --only-group docs --no-install-project

      - name: Build documentation
        run: uv run --no-sync zensical build --clean --strict

      - name: Remove Pages artifacts from prior attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Workflow artifacts persist across job re-runs, but deploy-pages
          # requires exactly one artifact with this reserved name.
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while IFS= read -r artifact_id; do
              gh api --method DELETE \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
